name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build application
      run: npm run build
      
    - name: Deploy to server
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: mecodes.live
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Navigate to deployment directory
          cd /var/www/mecodes.live
          
          # Pull latest code
          if [ ! -d ".git" ]; then
            git clone https://github.com/YOUR_USERNAME/YOUR_REPO_NAME.git .
          else
            git fetch origin
            git reset --hard origin/main
          fi
          
          # Install dependencies and build
          npm ci
          npm run build
          
          # Copy build files to web directory
          sudo rm -rf /var/www/mecodes.live/public_html/*
          sudo mkdir -p /var/www/mecodes.live/public_html
          sudo cp -r dist/* /var/www/mecodes.live/public_html/
          sudo chown -R www-data:www-data /var/www/mecodes.live/public_html
          sudo chmod -R 755 /var/www/mecodes.live/public_html